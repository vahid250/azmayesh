name: Phase A cloud advanced tests

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-lab/phase-a-github-runner
    paths:
      - "lab/phase-a/**"
      - ".github/workflows/phase-a-cloud-advanced.yml"

permissions:
  contents: read

jobs:
  phase-a-advanced:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install isolated-lab tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping
          python3 --version
          ip -Version
          nft --version

      - name: Run Phase A tests through Stage 7
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/phase-a-stage7.log"
          cleanup() {
            sudo bash lab/phase-a/phase-a-lab.sh down || true
          }
          trap cleanup EXIT
          {
            echo "=== create isolated IPv4 + IPv6 topology ==="
            sudo bash lab/phase-a/phase-a-lab.sh up
            echo "=== baseline UDP quota tests ==="
            sudo bash lab/phase-a/phase-a-traffic-test.sh
            echo "=== concurrent quota stress tests ==="
            sudo bash lab/phase-a/phase-a-advanced-test.sh
            echo "=== exact quota-boundary tests ==="
            sudo bash lab/phase-a/phase-a-boundary-test.sh
            echo "=== TCP quota tests ==="
            sudo bash lab/phase-a/phase-a-tcp-test.sh
            echo "=== IPv6 and bidirectional tests ==="
            sudo bash lab/phase-a/phase-a-ipv6-test.sh
            echo "=== Stage 6 mixed-family, bypass-resistance, and fail-closed tests ==="
            sudo bash lab/phase-a/phase-a-stage6-test.sh
            echo "=== Stage 7 multi-user, sustained-load, and recovery tests ==="
            sudo bash lab/phase-a/phase-a-stage7-test.sh
            echo "=== all configured tests completed ==="
          } 2>&1 | tee "$LOG"

      - name: Upload Stage 7 test log

        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-stage7-log
          path: ${{ runner.temp }}/phase-a-stage7.log
          if-no-files-found: warn
          retention-days: 7

  phase-a-accounting:
    name: Phase A Stage 8 — durable quota accounting
    needs: phase-a-advanced
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rma_test
          POSTGRES_PASSWORD: rma_test_password
          POSTGRES_DB: rma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rma_test -d rma_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://rma_test:rma_test_password@localhost:5432/rma_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.9"

      - name: Run durable quota ledger tests
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/phase-a-stage8.log"
          export POSTGRES_SERVICE_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:16/ {print $1; exit}')"
          test -n "$POSTGRES_SERVICE_ID"
          python lab/phase-a/phase-a-stage8-test.py 2>&1 | tee "$LOG"

      - name: Upload Stage 8 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-stage8-log
          path: ${{ runner.temp }}/phase-a-stage8.log
          if-no-files-found: warn
          retention-days: 7

  phase-a-account-lifecycle:
    name: Phase A Stage 9 — account lifecycle and entitlements
    needs: phase-a-accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rma_test
          POSTGRES_PASSWORD: rma_test_password
          POSTGRES_DB: rma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rma_test -d rma_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://rma_test:rma_test_password@localhost:5432/rma_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.9"

      - name: Run account lifecycle and entitlement tests
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/phase-a-stage9.log"
          python lab/phase-a/phase-a-stage9-test.py 2>&1 | tee "$LOG"

      - name: Upload Stage 9 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-stage9-log
          path: ${{ runner.temp }}/phase-a-stage9.log
          if-no-files-found: warn
          retention-days: 7
