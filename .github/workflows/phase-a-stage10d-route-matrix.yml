name: Phase A Stage 10D Route Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lab/phase-a/phase-a-stage10d-route-matrix-test.py"
      - "lab/phase-a/phase-a-stage10d-lab.sh"
      - ".github/workflows/phase-a-stage10d-route-matrix.yml"
      - ".github/workflows/phase-a-stage10d-hardening.yml"

permissions:
  contents: read

jobs:
  route-matrix:
    name: Stage 10D actual allowed and denied TCP routes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install isolated network tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables
      - name: Run disposable namespace route matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/phase-a-stage10d-route-matrix.log"
          cleanup() { sudo bash lab/phase-a/phase-a-stage10d-lab.sh down || true; }
          trap cleanup EXIT
          sudo bash lab/phase-a/phase-a-stage10d-lab.sh up
          sudo -E python3 lab/phase-a/phase-a-stage10d-route-matrix-test.py 2>&1 | tee "$LOG"
      - name: Upload route matrix evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-stage10d-route-matrix-evidence
          path: |
            ${{ runner.temp }}/phase-a-stage10d-route-matrix.log
            ${{ runner.temp }}/phase-a-stage10d-route-matrix-evidence.json
          if-no-files-found: warn
          retention-days: 14
