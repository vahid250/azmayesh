name: R&MA Read-only Exchange Catalog Audit

on:
  push:
    branches: ["rebuild/**"]
    paths:
      - ".github/workflows/market-catalog-audit.yml"
      - "backend/scripts/audit_exchange_catalogs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install "httpx>=0.27,<1"
      - name: Fetch official public market catalogs (read-only)
        run: |
          python scripts/audit_exchange_catalogs.py --output market-catalog-audit.json
          echo "----- MARKET CATALOG AUDIT (JSON) -----"
          cat market-catalog-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: rma-market-catalog-audit
          path: backend/market-catalog-audit.json
          if-no-files-found: error
          retention-days: 7
