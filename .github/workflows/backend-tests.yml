name: R&MA Backend Tests

on:
  push:
    branches: ["work/rma-backend-dashboard"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "render.yaml"
      - "docs/MINIAPP_DEPLOYMENT_FA.md"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "render.yaml"
      - "docs/MINIAPP_DEPLOYMENT_FA.md"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard API client syntax
        run: node --check ../frontend/rma-api.js
      - name: Check Cloudflare Pages proxy syntax
        run: |
          node --input-type=module --check < "../frontend/functions/api/[[path]].js"
          node --input-type=module --check < ../frontend/functions/health.js
      - name: Test Cloudflare Pages proxy behavior
        run: node ../frontend/check-pages-functions.mjs
      - name: Test Pages proxy to live FastAPI backend
        run: node ../frontend/check-pages-integration.mjs
      - name: Check dashboard integration and inline scripts
        run: node ../frontend/check-dashboard.mjs
      - name: Run tests
        run: PYTHONPATH=. pytest -q
