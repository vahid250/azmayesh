name: Phase A cloud namespace lab

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-lab/phase-a-github-runner
    paths:
      - "lab/phase-a/**"
      - ".github/workflows/phase-a-cloud-lab.yml"

permissions:
  contents: read

jobs:
  phase-a-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install isolated-lab tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping
          {
            echo "=== runner ==="
            uname -a
            echo "=== tools ==="
            ip -Version
            nft --version
            python3 --version
            echo "=== sudo ==="
            sudo -n true
          }

      - name: Run Phase A disposable namespace smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/phase-a-cloud.log"
          cleanup() {
            sudo bash lab/phase-a/phase-a-lab.sh down || true
          }
          trap cleanup EXIT
          {
            echo "=== capability probe ==="
            sudo ip netns list
            echo "=== create isolated topology ==="
            sudo bash lab/phase-a/phase-a-lab.sh up
            echo "=== topology status ==="
            sudo bash lab/phase-a/phase-a-lab.sh status
            echo "=== UDP quota smoke tests ==="
            sudo bash lab/phase-a/phase-a-traffic-test.sh
            echo "=== smoke tests completed ==="
          } 2>&1 | tee "$LOG"

      - name: Upload cloud lab log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-cloud-log
          path: ${{ runner.temp }}/phase-a-cloud.log
          if-no-files-found: warn
          retention-days: 7
