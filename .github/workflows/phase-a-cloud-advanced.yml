name: Phase A cloud advanced tests

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-lab/phase-a-github-runner
    paths:
      - "lab/phase-a/**"
      - ".github/workflows/phase-a-cloud-advanced.yml"

permissions:
  contents: read

jobs:
  phase-a-advanced:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install isolated-lab tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping
          python3 --version
          ip -Version
          nft --version

      - name: Run Phase A tests through Stage 6
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/phase-a-stage6.log"
          cleanup() {
            sudo bash lab/phase-a/phase-a-lab.sh down || true
          }
          trap cleanup EXIT
          {
            echo "=== create isolated IPv4 + IPv6 topology ==="
            sudo bash lab/phase-a/phase-a-lab.sh up
            echo "=== baseline UDP quota tests ==="
            sudo bash lab/phase-a/phase-a-traffic-test.sh
            echo "=== concurrent quota stress tests ==="
            sudo bash lab/phase-a/phase-a-advanced-test.sh
            echo "=== exact quota-boundary tests ==="
            sudo bash lab/phase-a/phase-a-boundary-test.sh
            echo "=== TCP quota tests ==="
            sudo bash lab/phase-a/phase-a-tcp-test.sh
            echo "=== IPv6 and bidirectional tests ==="
            sudo bash lab/phase-a/phase-a-ipv6-test.sh
            echo "=== Stage 6 mixed-family, bypass-resistance, and fail-closed tests ==="
            sudo bash lab/phase-a/phase-a-stage6-test.sh
            echo "=== all configured tests completed ==="
          } 2>&1 | tee "$LOG"

      - name: Upload Stage 6 test log

        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-stage6-log
          path: ${{ runner.temp }}/phase-a-stage6.log
          if-no-files-found: warn
          retention-days: 7
