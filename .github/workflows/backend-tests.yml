name: R&MA Backend, Billing, and Metering Tests

on:
  push:
    branches: ["work/rma-backend-dashboard", "rebuild/**", "security/**"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "render.yaml"
      - "docs/MINIAPP_DEPLOYMENT_FA.md"
      - "docs/USER_TERMS_FA.md"
      - "docs/PRIVACY_POLICY_FA.md"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "render.yaml"
      - "docs/MINIAPP_DEPLOYMENT_FA.md"
      - "docs/USER_TERMS_FA.md"
      - "docs/PRIVACY_POLICY_FA.md"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app tests host_agent scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard API client syntax
        run: |
          node --check ../frontend/rma-api.js
          node --check ../frontend/rma-terms.js
      - name: Check Cloudflare Pages proxy syntax
        run: |
          node --input-type=module --check < "../frontend/functions/api/[[path]].js"
          node --input-type=module --check < ../frontend/functions/health.js
      - name: Test Cloudflare Pages proxy behavior
        run: node ../frontend/check-pages-functions.mjs
      - name: Test Pages proxy to live FastAPI backend
        run: node ../frontend/check-pages-integration.mjs
      - name: Check dashboard integration and inline scripts
        run: node ../frontend/check-dashboard.mjs
      - name: Run tests
        run: PYTHONPATH=. pytest -q
      - name: Audit official exchange market catalogs (read-only)
        run: |
          python scripts/audit_exchange_catalogs.py --output market-catalog-audit.json
          echo "----- MARKET CATALOG AUDIT (JSON) -----"
          cat market-catalog-audit.json
      - name: Upload read-only market catalog report
        uses: actions/upload-artifact@v4
        with:
          name: rma-market-catalog-audit
          path: backend/market-catalog-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Set up Python 3.13 for Cloudflare Workers
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Validate Cloudflare Python Worker bundle (dry run)
        run: |
          rm -rf .worker-build
          mkdir -p .worker-build
          cp worker.py pyproject.toml wrangler.jsonc .worker-build/
          cp -R app .worker-build/
          cd .worker-build
          set -o pipefail
          # Sync Pyodide-compatible runtime packages into python_modules.
          uv run pywrangler sync
          # The local uv and Pyodide virtual environments are build-time only.
          # Keep them out of the Worker upload; python_modules contains the
          # vendored runtime dependencies required by the deployed Worker.
          rm -rf .venv .venv-workers
          npx --yes wrangler deploy --dry-run 2>&1 | tee /tmp/rma-worker-dry-run.log
          bundle_kib=$(sed -n 's/.*Total Upload: \([0-9.]*\) KiB.*/\1/p' /tmp/rma-worker-dry-run.log | tail -n 1)
          if [ -z "$bundle_kib" ]; then
            echo "Could not determine the uncompressed Worker bundle size."
            exit 1
          fi
          awk -v size="$bundle_kib" 'BEGIN { if (size > 65536) { printf "Worker bundle %.2f KiB exceeds Cloudflare 64 MiB limit (65536 KiB).\n", size; exit 1 } }'
