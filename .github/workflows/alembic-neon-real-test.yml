name: R&MA Real PostgreSQL Alembic Test

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/rma-hardening-from-dashboard
    paths:
      - .github/workflows/alembic-neon-real-test.yml

permissions:
  contents: read

concurrency:
  group: rma-alembic-real-test
  cancel-in-progress: false

jobs:
  alembic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.RMA_ALEMBIC_TEST_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.RMA_ALEMBIC_TEST_DATABASE_URL }}
      APP_ENV: test
      MOCK_MODE: "true"
    steps:
      - name: Check required secret without printing it
        shell: bash
        run: |
          set +x
          if [ -z "${DIRECT_DATABASE_URL}" ]; then
            echo "::error::Add the RMA_ALEMBIC_TEST_DATABASE_URL Actions secret before running this workflow."
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          value = os.environ["DIRECT_DATABASE_URL"]
          parsed = urlparse(value)
          if parsed.scheme not in {"postgres", "postgresql", "postgresql+psycopg"}:
              raise SystemExit("The test secret must be a PostgreSQL URL.")
          host = (parsed.hostname or "").lower()
          if not host.endswith(".neon.tech"):
              raise SystemExit("The test URL must point to a Neon endpoint, not an arbitrary host.")
          if not parsed.path or parsed.path == "/":
              raise SystemExit("The PostgreSQL URL must include a database name.")
          print("PostgreSQL URL shape validated; credentials were not displayed.")
          PY

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend and Alembic dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Confirm Alembic migration chain
        working-directory: backend
        run: alembic history

      - name: Run real Alembic migrations against the isolated Neon test branch
        working-directory: backend
        run: alembic upgrade head

      - name: Verify database revision
        working-directory: backend
        run: alembic current

      - name: Detect model/schema drift
        working-directory: backend
        run: alembic check
