name: Phase A Stage 10D Stateful Firewall Revocation

on:
  workflow_dispatch:
  push:
    branches:
      - security/phase-10d-remediation
    paths:
      - "lab/phase-a/phase-a-stage10d-stateful-revocation-test.py"
      - "lab/phase-a/phase-a-stage10d-lab.sh"
      - ".github/workflows/phase-a-stage10d-stateful-revocation.yml"
      - "backend/host_agent/**"
      - "backend/tests/test_host_agent.py"
      - "backend/host_agent/rma-wg-meter.service"
      - "backend/host_agent/REAL_HOST_TEST_RUNBOOK.md"
  pull_request:
    paths:
      - "lab/phase-a/phase-a-stage10d-stateful-revocation-test.py"
      - "lab/phase-a/phase-a-stage10d-lab.sh"
      - ".github/workflows/phase-a-stage10d-stateful-revocation.yml"
      - "backend/host_agent/**"
      - "backend/tests/test_host_agent.py"
      - "backend/host_agent/rma-wg-meter.service"
      - "backend/host_agent/REAL_HOST_TEST_RUNBOOK.md"

concurrency:
  group: stage10d-stateful-revocation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stateful-revocation:
    name: Stateful TCP session revocation and conntrack bypass checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install isolated network tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables
          python3 --version
          nft --version
      - name: Run stateful revocation probes in disposable namespaces
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/phase-a-stage10d-stateful-revocation.log"
          cleanup() { sudo bash lab/phase-a/phase-a-stage10d-lab.sh down || true; }
          trap cleanup EXIT
          sudo bash lab/phase-a/phase-a-stage10d-lab.sh up
          sudo -E python3 lab/phase-a/phase-a-stage10d-stateful-revocation-test.py 2>&1 | tee "$LOG"
      - name: Upload stateful revocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-stage10d-stateful-revocation-evidence
          path: |
            ${{ runner.temp }}/phase-a-stage10d-stateful-revocation.log
            ${{ runner.temp }}/phase-a-stage10d-stateful-revocation-evidence.json
          if-no-files-found: warn
          retention-days: 14
